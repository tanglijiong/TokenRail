[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[profile.ci]
fuzz = { runs = 256 }

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false
