name: Contracts

on:
  push:
    paths:
      - "contracts/**"
      - "scripts/*.sh"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/*.sh"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install pinned Foundry tools
        run: npm ci
      - name: Check tool versions
        working-directory: .
        run: scripts/check-m0-environment.sh
      - name: Check formatting
        run: ../scripts/check-solidity-format.sh
      - name: Build contracts
        run: forge build --sizes
      - name: Lint contracts
        run: forge lint --deny warnings
      - name: Run contract tests
        run: ../scripts/run-contract-tests.sh
