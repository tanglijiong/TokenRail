<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TokenRail · 条件支付</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"></head>
<body data-page="payment"><div class="shell"><aside><div class="brand">TokenRail<small>PROGRAMMABLE SETTLEMENT</small></div><nav><a href="/index.html">总览</a><a href="/settlement.html">券款交割</a><a href="/payments.html">条件支付</a><a href="/operations.html">操作与对账</a></nav><div class="aside-note">测试确认员的 release 是一项链上声明，不证明物流或现实条件已经发生。</div></aside><main>
<header class="topbar"><div><h1>条件托管支付</h1><p class="lead">付款人预存现金。指定确认员可在截止前 release；截止后只有付款人可 refund。</p></div><div class="identity"><label>演示身份<select id="actor"><option value="investorA">投资者 A</option><option value="investorB">投资者 B</option><option value="operator">运营与确认员</option></select></label><div class="actions"><span class="badge" id="role-badge"></span></div></div></header>
<div class="notice">冻结或 Token 暂停可能令 release/refund 回滚。此时链上仍为 FUNDED，页面会显示 REVERTED 操作和 HOLD 状态。</div><section class="grid">
<article class="card span-4"><h2>授权 Escrow</h2><p class="sub">付款人先允许托管合约扣取精确现金金额。</p><form id="payment-allowance" class="form"><label>现金金额（分）<input name="amount" value="100000" required></label><button type="submit">提交授权</button></form><label style="margin-top:15px">Escrow 地址<input id="escrow-address" readonly></label></article>
<article class="card span-8"><h2>创建并注资</h2><form id="payment-form" class="form two"><label>收款钱包<input name="payee" required placeholder="0x..."></label><label>确认员钱包<input name="attestor" required placeholder="0x..."></label><label>金额（分）<input name="amount" value="100000" required></label><label>截止时间<input type="datetime-local" name="deadline" required></label><button class="wide" type="submit">注资并创建付款</button></form></article>
<article class="card span-12"><h2>查询与动作</h2><form id="payment-lookup" class="form"><label>paymentId<input id="payment-id" name="id" pattern="0x[0-9a-fA-F]{64}" required></label><button type="submit">读取链上状态</button></form><div class="actions"><button data-payment-action="release">确认员放款</button><button class="danger" data-payment-action="refund">付款人到期退款</button></div><p class="sub">最后提交 operationId</p><div id="last-operation" class="mono">—</div><pre id="payment-result">尚未查询</pre></article></section>
</main></div><div id="toast"></div><script src="/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const d=new Date(Date.now()+3600000);document.querySelector('[name=deadline]').value=d.toISOString().slice(0,16);});</script></body></html>
